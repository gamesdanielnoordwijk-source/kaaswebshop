<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veilingen – Forhaut</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .veilingen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 30px;
        }

        .veiling-kaart {
            background: #fff8e1;
            border-radius: 25px;
            padding: 22px;
            text-align: center;
            border: 3px solid #ffb300;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .veiling-kaart:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 35px rgba(0,0,0,0.2);
        }

        .veiling-kaart img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 14px;
        }

        .huidig-bod {
            font-size: 26px;
            font-weight: bold;
            color: #e65100;
            margin: 8px 0;
        }

        .countdown {
            display: inline-block;
            background: linear-gradient(135deg, #ff6f00, #ff9800);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            margin: 10px 0;
        }

        .countdown.verlopen {
            background: linear-gradient(135deg, #9e9e9e, #757575);
        }

        .badge-actief {
            display: inline-block;
            background: #43a047;
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .badge-verlopen {
            display: inline-block;
            background: #9e9e9e;
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .bied-knop {
            background: linear-gradient(135deg, #ff9800, #ff6f00);
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: 0.25s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-decoration: none;
            display: block;
        }

        .bied-knop:hover {
            transform: scale(1.04);
            background: linear-gradient(135deg, #ffb300, #ff8f00);
        }

        .bied-knop.disabled {
            background: linear-gradient(135deg, #9e9e9e, #757575);
            cursor: default;
            transform: none;
        }

        .aantal-biedingen {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<header class="header-index">
    <h1>🔨 Veilingen</h1>
    <nav>
        <ul>
            <a href="index.html" id="index2-knop">🧀</a>
            <a href="winkelwagen.html" id="winkelwagen-knop">🛒</a>
        </ul>
    </nav>
</header>

<div style="padding: 20px 30px 0; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;">
    <div>
        <h2 style="margin:0;">Actieve & recent gesloten veilingen</h2>
        <p style="color:#555;margin:6px 0 0;">Log in om mee te bieden. Hoogste bieder wint!</p>
    </div>
    <a href="veiling-beheer.html" style="background:linear-gradient(135deg,#ff9800,#ff6f00);color:white;padding:12px 20px;border-radius:14px;font-weight:bold;font-size:15px;text-decoration:none;box-shadow:0 5px 15px rgba(0,0,0,0.15);">⚙️ Veilingen beheren</a>
</div>

<div class="veilingen-grid" id="veilingen-container">
    <p style="padding:20px;">Veilingen laden...</p>
</div>

<script src="veiling.js"></script>
</body>
</html>
