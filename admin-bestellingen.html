<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Bestellingen</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body { background: #ffd740; min-height: 100vh; font-family: Arial, sans-serif; margin: 0; }
        #wachtwoord-overlay { position: fixed; inset: 0; background: #ffd740; display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .ww-kaart { background: #fff8e1; border: 3px solid #ffb300; border-radius: 24px; padding: 40px 36px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.15); max-width: 340px; width: 90%; }
        .ww-kaart h2 { margin: 0 0 8px; font-size: 22px; color: #222; }
        .ww-kaart p { color: #888; font-size: 14px; margin: 0 0 22px; }
        .ww-kaart input { width: 100%; padding: 12px 16px; border: 2px solid #ffb300; border-radius: 12px; font-size: 18px; text-align: center; letter-spacing: 6px; outline: none; box-sizing: border-box; }
        .ww-kaart input:focus { border-color: #e69634; }
        .ww-knop { margin-top: 16px; width: 100%; padding: 13px; background: linear-gradient(135deg, #ffb300, #e69634); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .ww-knop:hover { background: linear-gradient(135deg, #e69634, #c17800); }
        .ww-fout { color: #e53935; font-size: 13px; margin-top: 10px; min-height: 18px; }
        header { background: linear-gradient(135deg, #ffd740, #ffb300); padding: 20px 28px; display: flex; align-items: center; gap: 16px; border-radius: 0 0 18px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); margin-bottom: 28px; }
        header h1 { margin: 0; font-size: 28px; color: #222; }
        .terug-knop { background: #ff8f00; color: #fff; border: none; border-radius: 22px; padding: 10px 22px; font-size: 15px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-left: auto; }
        .terug-knop:hover { background: #e65100; }
        .stats-balk { background: rgba(255,255,255,0.5); border-radius: 14px; padding: 14px 24px; margin: 0 24px 24px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: bold; color: #555; }
        .stats-balk span { color: #e69634; font-size: 22px; }
        .bestelling-kaart { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.09); margin: 0 24px 20px; overflow: hidden; }
        .bestelling-header { background: linear-gradient(135deg, #ffb300, #e69634); color: #fff; padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .bestelling-nr { font-weight: bold; font-size: 16px; }
        .bestelling-datum { font-size: 13px; opacity: 0.9; margin-left: auto; }
        .bestelling-totaal { background: rgba(255,255,255,0.25); padding: 4px 14px; border-radius: 20px; font-weight: bold; font-size: 15px; }
        .bestelling-body { display: flex; gap: 0; }
        .klant-info, .items-lijst { padding: 18px 22px; flex: 1; }
        .klant-info { border-right: 1px solid #f0e0a0; }
        .klant-info strong, .items-lijst strong { display: block; margin-bottom: 8px; color: #e69634; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .klant-info p { margin: 3px 0; font-size: 14px; color: #444; }
        .bestelling-item { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f5f0e8; font-size: 14px; color: #333; }
        .bestelling-item:last-child { border-bottom: none; }
        .leeg { text-align: center; padding: 60px 20px; font-size: 18px; color: #888; background: rgba(255,255,255,0.4); border-radius: 14px; margin: 0 24px; }
        @media (max-width: 600px) {
            .bestelling-body { flex-direction: column; }
            .klant-info { border-right: none; border-bottom: 1px solid #f0e0a0; }
        }
    </style>
</head>
<body>
    <div id="wachtwoord-overlay">
        <div class="ww-kaart">
            <h2>🔐 Beheerder</h2>
            <p>Voer het wachtwoord in om verder te gaan</p>
            <input type="password" id="ww-invoer" placeholder="••••" maxlength="20" />
            <button class="ww-knop" id="ww-knop">Inloggen</button>
            <div class="ww-fout" id="ww-fout"></div>
        </div>
    </div>

    <header>
        <h1>📋 Bestellingen beheren</h1>
        <a href="index.html" class="terug-knop">← Terug naar winkel</a>
    </header>

    <div class="stats-balk">
        Totaal aantal bestellingen: <span id="totaal-bestellingen">0</span>
    </div>

    <div id="bestellingen-container"></div>

    <script src="admin-bestellingen.js"></script>
</body>
</html>
