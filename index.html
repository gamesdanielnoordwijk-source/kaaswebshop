<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header-index">
    <h1>Webshop</h1>
    <nav>
        <ul>
            <a href="veiling.html" id="veiling-knop">🔨</a>
            <a href="winkelwagen.html" id="winkelwagen-knop">🛒</a>
            <button id="login-knop">🔓</button>
            <a href="admin-bestellingen.html" id="admin-knop" title="Bestellingen bekijken">📋</a>
            <button id="open-register">🫃</button>
        </ul>
    </nav>
</header>

<div id="filters">
    <input type="text" id="zoek-input" placeholder="Zoek product...">
    <select id="categorie-filter">
        <option value="alles">Alles</option>
        <option value="kaas">Kaas</option>
        <option value="niet-kaas">Niet kaas</option>
    </select>
    <select id="sort-prijs">
        <option value="geen">Sorteer</option>
        <option value="laag-hoog">Prijs laag → hoog</option>
        <option value="hoog-laag">Prijs hoog → laag</option>
    </select>
    <input type="number" id="min-prijs" placeholder="Min prijs">
    <input type="number" id="max-prijs" placeholder="Max prijs">
</div>

<div id="loading" style="text-align: center; padding: 40px; font-size: 18px;">
    ⏳ Producten laden...
</div>

<div class="producten" id="producten-container">
    <!-- Producten worden hier geladen via JavaScript -->
</div>

<div id="melding">
    Toegevoegd!
    <a href="winkelwagen.html">Ga naar winkelwagen</a>
</div>

<div id="login-popup" class="popup">
    <div class="popup-content">
        <span id="close-popup">&times;</span>
        <h2>Inloggen</h2>
        <input id="gebruikersnaam" type="text" placeholder="Gebruikersnaam">
        <input id="wachtwoord" type="password" placeholder="Wachtwoord">
        <button id="login-btn">Login</button>
        <p id="login-fout" style="color:red;"></p>
    </div>
</div>

<div id="register-popup" class="popup">
    <div class="popup-content">
        <span id="close-register">&times;</span>
        <h2>Account aanmaken</h2>
        <input type="text" id="reg-gebruikersnaam" placeholder="Gebruikersnaam">
        <input type="password" id="reg-wachtwoord" placeholder="Wachtwoord">
        <input type="text" id="reg-naam" placeholder="Naam">
        <input type="text" id="reg-adres" placeholder="Adres">
        <input type="email" id="reg-email" placeholder="Email">
        <button id="register-btn">Registreren</button>
        <p id="register-fout" style="color:red;"></p>
    </div>
</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<!-- Supabase Configuratie -->
<script src="config.js"></script>
<!-- Hoofd Script -->
<script src="script.js"></script>
</body>
</html>
